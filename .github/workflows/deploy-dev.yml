name: Deploy Laravel App

on:
  push:
    branches: [ main, dev ] # Adjust to your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/${{ github.ref_name }}

            # 1. Pull the latest code
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 2. Rebuild and restart (Fast because of Docker caching)
            # The --build flag ensures your Dockerfile (with intl) is checked
            docker compose up -d --build

            # 3. Frontend Assets (using a temporary node container to keep your app container light)
            docker run --rm -v $(pwd):/app -w /app node:20-alpine sh -c "npm install && npm run build"

            # 4. Backend Dependencies
            docker compose exec -T app composer install --no-interaction --optimize-autoloader

            # 5. Database & Maintenance
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize
            docker compose exec -T app php artisan filament:upgrade

            # 6. Final Permission Sync (Crucial for UID 33)
            sudo chown -R 33:33 /var/www/${{ github.ref_name }}
            sudo chmod -R 775 storage bootstrap/cache
            
            echo "🚀 Deployment of ${{ github.ref_name }} successful!"