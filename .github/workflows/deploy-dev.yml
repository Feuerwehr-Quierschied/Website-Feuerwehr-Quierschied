name: Deploy Laravel App

on:
  push:
    branches: [ main, dev ] # Adjust to your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/${{ github.ref_name }}

            # 1. Fix Git ownership and pull code
            git config --global --add safe.directory /var/www/${{ github.ref_name }}
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 2. Re-apply ownership to the whole folder BEFORE doing anything
            # This ensures 'public/' and 'vendor/' are writable by user 33
            sudo chown -R 33:33 .
            sudo chmod -R 775 storage bootstrap/cache public

            # 3. Rebuild and restart containers
            docker compose up -d --build

            # 4. Frontend Assets
            docker run --rm -v $(pwd):/app -w /app node:20-alpine sh -c "npm install && npm run build"

            # 5. Composer Install (now as user 33)
            # We run this as user 33 so the files it creates are already owned correctly
            docker compose exec -T --user 33 app composer install --no-interaction --optimize-autoloader

            # 6. Laravel Maintenance & Filament Upgrade
            # This will now have permission to copy files into public/
            docker compose exec -T --user 33 app php artisan migrate --force
            docker compose exec -T --user 33 app php artisan filament:upgrade
            docker compose exec -T --user 33 app php artisan shield:generate --all --panel=admin --option=policies_and_permissions --no-interaction
            docker compose exec -T --user 33 app php artisan optimize
            
            # 7. Final cleanup
            sudo chown -R 33:33 .
            
            echo "🚀 Deployment successful!"